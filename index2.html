<div class="step" id="testStep" style="display: none;">
            <h3>Step 3: Test Device</h3>
            <button onclick="sendCommand('STATUS')">📊 Get Status</button>
            <button onclick="sendCommand('LED')">💡 Test LED</button>
            <button onclick="sendCommand('ANT:1')">📶 Internal Antenna</button>
            <button onclick="sendCommand('ANT:2')">📡 External Antenna</button>
        </div><!DOCTYPE html>
<html>
<head>
    <title>ESP32-C6 WiFi Setup</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .step {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            border-left: 4px solid #00ff88;
        }
        button {
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,255,136,0.3);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,255,136,0.4);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.9);
            color: #333;
            font-size: 16px;
        }
        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background: rgba(0,255,136,0.2);
            border: 1px solid #00ff88;
        }
        .error {
            background: rgba(255,100,100,0.2);
            border: 1px solid #ff6464;
        }
        .info {
            background: rgba(100,200,255,0.2);
            border: 1px solid #64c8ff;
        }
        #log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ESP32-C6 WiFi Setup</h1>
        
        <div class="step">
            <h3>Step 1: Connect Device</h3>
            <button id="connectBtn" onclick="connectDevice()">Connect to ESP32-C6</button>
            <div id="connectionStatus"></div>
        </div>

        <div class="step" id="wifiStep" style="display: none;">
            <h3>Step 2: Configure WiFi</h3>
            <input type="text" id="ssid" placeholder="WiFi Network Name (SSID)" />
            <input type="password" id="password" placeholder="WiFi Password" />
            <button onclick="configureWifi()">Configure WiFi</button>
        </div>

        <div class="step" id="statusStep" style="display: none;">
            <h3>Status</h3>
            <div id="statusMessage"></div>
        </div>

        <div id="log"></div>
    </div>

    <script>
        let port;
        let reader;
        let writer;

        async function sendCommand(command) {
            if (!writer) {
                alert('Not connected to device');
                return;
            }
            
            try {
                const commandWithNewline = command + '\r\n';
                const data = new TextEncoder().encode(commandWithNewline);
                await writer.write(data);
                log(`Sent: ${command}`);
            } catch (error) {
                log('Send error: ' + error.message);
            }
        }

        function log(message) {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        async function connectDevice() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                writer = port.writable.getWriter();
                reader = port.readable.getReader();
                
                document.getElementById('connectionStatus').innerHTML = 
                    '<div class="status success">✅ Connected successfully!</div>';
                document.getElementById('wifiStep').style.display = 'block';
                document.getElementById('connectBtn').disabled = true;
                
                log('Connected to ESP32-C6');
                
                // Start reading responses
                readLoop();
                
            } catch (error) {
                document.getElementById('connectionStatus').innerHTML = 
                    '<div class="status error">❌ Connection failed: ' + error.message + '</div>';
                log('Connection error: ' + error.message);
            }
        }

        async function readLoop() {
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    const text = new TextDecoder().decode(value);
                    log('Received: ' + text.trim());
                    
                    // Check for specific responses
                    if (text.includes('Connected with') || text.includes('WiFi Connected') || text.includes('IP:')) {
                        document.getElementById('statusMessage').innerHTML = 
                            '<div class="status success">🎉 WiFi configured successfully!</div>';
                        document.getElementById('statusStep').style.display = 'block';
                    }
                    
                    if (text.includes('WiFi connection failed') || text.includes('failed on both antennas')) {
                        document.getElementById('statusMessage').innerHTML = 
                            '<div class="status error">❌ WiFi connection failed. Check credentials.</div>';
                        document.getElementById('statusStep').style.display = 'block';
                    }
                    
                    // Show antenna switching
                    if (text.includes('Switched to INTERNAL') || text.includes('Switched to EXTERNAL')) {
                        log('✅ ' + text.trim());
                    }
                    
                    // Show RSSI readings
                    if (text.includes('RSSI:')) {
                        log('📶 ' + text.trim());
                    }
                }
            } catch (error) {
                log('Read error: ' + error.message);
            }
        }

        async function configureWifi() {
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            
            if (!ssid) {
                alert('Please enter WiFi network name');
                return;
            }
            
            try {
                // Send command with explicit line ending and more debugging
                const command = `WIFI:${ssid}:${password}\r\n`;
                console.log('Sending command:', command);
                log(`Sending: ${command.trim()}`);
                
                const data = new TextEncoder().encode(command);
                await writer.write(data);
                
                log(`WiFi config sent - SSID: ${ssid}, Password length: ${password.length}`);
                document.getElementById('statusMessage').innerHTML = 
                    '<div class="status info">⏳ Configuring WiFi... Check serial output</div>';
                document.getElementById('statusStep').style.display = 'block';
                
            } catch (error) {
                document.getElementById('statusMessage').innerHTML = 
                    '<div class="status error">❌ Failed to send config: ' + error.message + '</div>';
                log('Send error: ' + error.message);
            }
        }

        // Check if Web Serial API is supported
        if ('serial' in navigator) {
            log('Web Serial API supported');
        } else {
            document.body.innerHTML = '<div class="container"><h1>❌ Browser Not Supported</h1><p>Please use Chrome, Edge, or Opera browser.</p></div>';
        }
    </script>
</body>
</html>
